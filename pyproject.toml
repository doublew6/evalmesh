[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evalmesh"
version = "0.1.0"
description = "Privacy-first evaluation control plane for agents, automations, and skills"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "EvalMesh contributors" }]
keywords = ["agents", "evaluation", "observability", "skills", "opik"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/doublew6/evalmesh"
Repository = "https://github.com/doublew6/evalmesh.git"
Issues = "https://github.com/doublew6/evalmesh/issues"
Documentation = "https://github.com/doublew6/evalmesh/tree/main/docs"

[project.optional-dependencies]
opik = ["opik>=2.2.31,<2.3"]
dev = ["ruff>=0.9,<1"]

[project.scripts]
evalmesh = "evalmesh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"evalmesh.schemas" = ["*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
